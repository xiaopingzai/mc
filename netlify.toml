[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

# The game's PHP endpoints live at /api/*.php. On Netlify the same paths are
# served by a single Function so the existing front end needs no changes.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# The three game bundles are versioned with ?v=...; cache them hard so a phone
# does not re-download ~6 MB every time the page opens.
[[headers]]
  for = "/js/pages-part*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[functions.api]
  timeout = 26
