        slow = true;
        txt.textContent = '正在下载游戏资源（约 6 MB）… 若一直为 0%，请用 Safari / Chrome 打开';
        if (retry) retry.style.display = 'inline-block';
      }
    }, 8000);
    (function step() {
      var b = document.getElementById('boot'); if (!b || b.style.display === 'none' || window.__bootDone) return;
      var want = got ? (got < total ? 85 * got / total : 85 + 14 * (1 - Math.exp(-(performance.now() - (step.t || (step.t = performance.now()))) / 4000)))
                     : 2 + 8 * (0.5 + 0.5 * Math.sin((performance.now() - started) / 700));
      shown = Math.max(shown, Math.min(99, want));
      window.__bootProgress = shown;
      bar.style.width = shown.toFixed(1) + '%';
      if (!errors && !slow) txt.textContent = got ? (got < total ? '正在加载… ' : '正在准备世界… ') + Math.floor(shown) + '%' : '正在连接服务器…';
      setTimeout(step, 100);
    })();
  })();
</script>
<script>
  // 启动动画：默认关闭；用户在设置里手动打开后才播 media/startup.mp4（也可换成本地文件），加载期间循环播放。
  // 移动端浏览器常常拦截带声音的自动播放，原生 <video> 会露出白底播放键；这里视频默认隐藏，先尝试原声，
  // 被拦截后转静音重试，还不行才显示自绘的全黑播放层，绝不让原生控件露出来。
  (function () {
    var KEY = 'mcjs-startup', cfg = { on: false, src: 'builtin' };
    try { var c = JSON.parse(localStorage.getItem(KEY) || 'null'); if (c && typeof c === 'object') { cfg.on = c.on === true; cfg.src = c.src === 'custom' ? 'custom' : 'builtin'; } } catch (e) { }
    if (!cfg.on) return;
    var boot = document.getElementById('boot'), v = document.getElementById('bootvideo'), layer = document.getElementById('bootplay');
    if (!boot || !v) return;
    var hint = document.getElementById('boothint');
    function ok() {
      // 播放层显示时也会先把 __bootHasVideo 置 true（让“点击开始”留在启动页），
      // 所以不能用这个标志判断视频是否已经真正播放；重复调用 ok 是幂等的。
      window.__bootHasVideo = true; boot.classList.add('hasvideo'); boot.classList.remove('hasplay'); v.style.display = 'block'; if (layer) layer.style.display = 'none';
      if (hint) hint.textContent = v.muted ? '点击画面开启声音 · 加载完成后点「点击开始」进入主菜单' : '默认开启声音 · 加载完成后点「点击开始」进入主菜单';
    }
    function fallback() {
      try { v.pause(); } catch (e) { }
      v.style.display = 'none'; boot.classList.remove('hasvideo'); boot.classList.add('hasplay');
      // 保留启动页，用自绘黑底播放层等一次点击；world ready 时仍给「点击开始」
      window.__bootHasVideo = true;
      if (layer) layer.style.display = 'flex';
    }
    function tryMuted() {
      v.muted = true;
      var p = v.play();
      if (p && p.then) p.then(ok).catch(fallback); else { /* 老浏览器：等 playing 事件 */ }
    }
    function begin(sound) {
      v.muted = !sound; v.volume = 1;
      var p = v.play();
      if (p && p.then) p.then(ok).catch(function () { if (sound) tryMuted(); else fallback(); });
    }
    v.addEventListener('playing', ok);
    if (layer) layer.addEventListener('click', function () { layer.style.display = 'none'; v.volume = 1; begin(true); });
    function show(url) {
      if (!url) return;
      v.src = url; v.muted = false; v.loop = true; v.playsInline = true; v.controls = false;
      v.style.display = 'none'; boot.classList.remove('hasvideo'); window.__bootHasVideo = false;
      // 触屏设备上浏览器一定拦截“带声音的自动播放”。与其让它露出原生白底播放键，
      // 不如直接显示自绘播放层，等用户点一下再带声音开始。
      const touch = (navigator.maxTouchPoints || 0) > 0 || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
      // 触屏设备优先静音自动播放：muted + playsinline 通常能直接播，启动动画不会先卡在一层
      // “点击播放”的黑屏上；点画面再开声音。只有静音播放也失败时才退回自绘播放层。
      if (touch) { tryMuted(); return; }
      begin(true);
    }
    function fail() { v.style.display = 'none'; boot.classList.remove('hasvideo'); boot.classList.remove('hasplay'); window.__bootHasVideo = false; if (layer) layer.style.display = 'none'; }
    v.addEventListener('error', fail);
    // 5 秒还没有画面也没有进入自绘播放层：直接放弃影片，回到普通加载页，避免启动页卡死
    setTimeout(function () {
      if (!window.__bootHasVideo) { v.style.display = 'none'; boot.classList.remove('hasvideo'); try { v.pause(); } catch (e) { } }
    }, 5000);
    if (cfg.src === 'custom') {
      try {
        var r = indexedDB.open('mcjs-media', 1);
        r.onupgradeneeded = function () { var db = r.result; if (!db.objectStoreNames.contains('blobs')) db.createObjectStore('blobs'); };
        r.onsuccess = function () {
          try {
            var q = r.result.transaction('blobs', 'readonly').objectStore('blobs').get('startup');
            q.onsuccess = function () { if (q.result) show(URL.createObjectURL(q.result)); else show('media/startup.mp4'); };
            q.onerror = function () { show('media/startup.mp4'); };
          } catch (e) { show('media/startup.mp4'); }
        };
        r.onerror = function () { show('media/startup.mp4'); };
      } catch (e) { show('media/startup.mp4'); }
    } else show('media/startup.mp4');
    v.addEventListener('click', function () {
      if (v.muted) { v.muted = false; v.volume = 1; }
      if (hint) hint.textContent = '声音已开启 · 点「点击开始」进入主菜单';
    });
    // 自动播放被拦截时会先静音播放；玩家点启动页任何位置都算一次用户手势，立刻开声音。
    // 之前只有点到视频本身才取消静音，很多手机/触屏笔记本点到了文字层，听起来就是“启动动画没声音”。
    document.addEventListener('click', function () {
      if (v.style.display !== 'none' && v.muted) {
        try { v.muted = false; v.volume = 1; v.play(); } catch (e) { }
        if (hint) hint.textContent = '声音已开启 · 点「点击开始」进入主菜单';
      }
    }, true);
  })();
</script>

<script>
  // 标题界面准备好后：有启动视频就停在这里等玩家点「点击开始」（可以慢慢看完），没有就直接进主菜单
  (function wait() {
    var b = document.getElementById('boot'); if (!b) return;
    if (window.game && window.game.state !== 'boot') {
      if (window.__bootHasVideo) {
        // 世界准备好了：把假进度条直接收尾到 100%，再出「点击开始」
        window.__bootDone = true; window.__bootProgress = 100;
        var bar = document.querySelector('#bootbar i'); if (bar) bar.style.width = '100%';
        var txt = document.getElementById('boottext'); if (txt) txt.textContent = '加载完成';
        var btn = document.getElementById('bootcontinue');
        if (btn) { btn.style.display = 'block'; btn.onclick = function () { b.style.display = 'none'; var bv = document.getElementById('bootvideo'); if (bv) bv.pause(); }; }
      } else b.style.display = 'none';
      return;
    }
    setTimeout(wait, 100);
  })();
</script>
